<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expensive — Private Expense Tracker</title>
<meta name="theme-color" content="#151515">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-root">
  <!-- Auth screens render here when logged out -->
  <div id="auth-root" class="auth-root" hidden></div>

  <!-- Main app shell renders here when logged in -->
  <div id="shell" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">▤</span>
        <span class="brand-name">Expensive</span>
      </div>
      <nav class="nav" id="nav" aria-label="Main navigation">
        <a href="#/dashboard" data-route="dashboard"><span class="nav-ico" aria-hidden="true">◧</span>Dashboard</a>
        <a href="#/transactions" data-route="transactions"><span class="nav-ico" aria-hidden="true">≡</span>Transactions</a>
        <a href="#/budgets" data-route="budgets"><span class="nav-ico" aria-hidden="true">◔</span>Budgets</a>
        <a href="#/categories" data-route="categories"><span class="nav-ico" aria-hidden="true">◇</span>Categories</a>
        <a href="#/analytics" data-route="analytics"><span class="nav-ico" aria-hidden="true">◫</span>Analytics</a>
        <a href="#/settings" data-route="settings"><span class="nav-ico" aria-hidden="true">⚙</span>Settings</a>
      </nav>
      <button class="btn btn-primary add-btn" id="global-add-btn" type="button">+ Add transaction</button>
      <button class="btn btn-ghost logout-btn" id="logout-btn" type="button">Log out</button>
    </aside>

    <main class="main" id="main" role="main"></main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation">
      <a href="#/dashboard" data-route="dashboard"><span class="nav-ico">◧</span><span>Home</span></a>
      <a href="#/transactions" data-route="transactions"><span class="nav-ico">≡</span><span>History</span></a>
      <button type="button" class="bottom-add" id="bottom-add-btn" aria-label="Add transaction">+</button>
      <a href="#/budgets" data-route="budgets"><span class="nav-ico">◔</span><span>Budgets</span></a>
      <a href="#/settings" data-route="settings"><span class="nav-ico">⚙</span><span>Settings</span></a>
    </nav>
  </div>
</div>

<div id="modal-layer" class="modal-layer" aria-live="polite"></div>
<div id="toast-layer" class="toast-layer" aria-live="polite"></div>

<script src="https://unpkg.com/pocketbase@0.21.3/dist/pocketbase.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script type="module" src="js/app.js"></script>
</body>
</html>
